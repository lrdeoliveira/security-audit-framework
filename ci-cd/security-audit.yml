# ============================================================================
# security-audit.yml — Pipeline de segurança contínua
# Framework de Auditoria de Segurança v1.2
#
# COPIE este arquivo para o repositório ALVO em:  .github/workflows/security-audit.yml
# (não roda no repo do framework — roda no código que você audita)
#
# O que faz em cada PR/push:
#   - Semgrep   (SAST)       -> SARIF no GitHub Code Scanning
#   - Trivy     (SCA+IaC+secret) -> SARIF
#   - Gitleaks  (segredos)
#   - osv-scanner (deps)     -> SARIF
#   - Gate: falha o build se houver vulnerabilidade CRITICAL
#
# Requisitos: nenhum segredo obrigatório. Para regras premium do Semgrep,
# defina o secret SEMGREP_APP_TOKEN (opcional).
# ============================================================================

name: security-audit

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # toda segunda 06:00 UTC (varredura semanal)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # necessário para upload de SARIF (Code Scanning)

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ SAST
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@08c6903cd835c34503714652243d6901844b2450 # v5.0.0
      - name: Semgrep scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}   # opcional
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ----------------------------------------------------------- SCA + IaC
  trivy:
    name: SCA / IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd835c34503714652243d6901844b2450 # v5.0.0
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy gate (falha em CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: "1"            # quebra o build se houver CRITICAL
          ignore-unfixed: true

  # --------------------------------------------------------------- Segredos
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd835c34503714652243d6901844b2450 # v5.0.0
        with:
          fetch-depth: 0           # histórico completo para varrer commits
      - uses: gitleaks/gitleaks-action@4a2503250529d380e227a6f2389d047321689255 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------- SCA (OSV) deps
  osv-scanner:
    name: Dependências (osv-scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
